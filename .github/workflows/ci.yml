name:   CI

on: 
    push:
        branches: [main]
    
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Get the code
              uses: actions/checkout@v4

            
            - name: Set up python
              uses: actions/setup-python@v5
              with:
                python-version: "3.12"

            - name: install dependancies
              run: python -m pip install -r src/requirements.txt -r requirements-dev.txt
            
            - name: Run tests
              run: python -m pytest -q

    docker:
        runs-on: ubuntu-latest
        steps:
            - name: Get the code
              uses: actions/checkout@v4

            - name: Build the Docker image
              run: docker build -t churn-api .
